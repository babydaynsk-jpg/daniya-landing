<style>
  :root{--bg:#FAF7F2;--card:#FFFFFF;--line:#E7E0D5;--ink:#1F1D1B;--muted:#57524B;--soft:#6E685F;--accent:#C8235A;--tint:#FBEAF0;}
  *{box-sizing:border-box;margin:0;}
  body{background:var(--bg);color:var(--ink);font-family:"Golos Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;}

  .lead{margin-top:20px;font-size:clamp(15px,1.5vw,18px);line-height:1.65;color:var(--muted);max-width:60ch;}
  .btns{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap;}
  .btn{background:var(--accent);color:#fff;text-decoration:none;font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;padding:14px 24px;border-radius:8px;}
  .btn.dark{background:#151515;}
  footer{border-top:1px solid var(--line);padding:26px 20px;text-align:center;font-size:13px;color:var(--soft);}
  footer a{color:var(--soft);text-decoration:underline;text-underline-offset:3px;}
